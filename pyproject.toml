[build-system]
requires = ["setuptools>=68,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-provider-apinex"
version = "0.1.0"
description = "APInex model-provider plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "APInex" }]
keywords = ["hermes-agent", "hermes-plugin", "model-provider", "apinex", "claude", "openai", "deepseek"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
# Standard library only.
dependencies = []

[project.urls]
Homepage = "https://github.com/Apinex-AI/hermes-provider-apinex"
Issues = "https://github.com/Apinex-AI/hermes-provider-apinex/issues"

# Optional pip distribution: Hermes imports a bare-module entry point for its
# module-level register_provider() call, once the user lists it in
# plugins.enabled.
[project.entry-points."hermes_agent.plugins"]
apinex = "apinex"

[tool.setuptools]
packages = ["apinex"]

[tool.setuptools.package-data]
apinex = ["plugin.yaml", "after-install.md", "README.md"]
