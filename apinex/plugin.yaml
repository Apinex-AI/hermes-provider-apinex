author: APInex
license: MIT
homepage: https://apinex.bond/?utm_source=hermes&utm_medium=plugin
requires_hermes: ">=0.21.5"
requires_env:
  - name: APINEX_API_KEY
    description: "APInex API key (sk-apx-...)"
    url: "https://apinex.bond/integrations/hermes?utm_source=hermes&utm_medium=plugin"
    secret: true
